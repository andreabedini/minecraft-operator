apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-operator
  namespace: minecraft-operator
  labels:
    app.kubernetes.io/name: minecraft-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft-operator
    spec:
      serviceAccountName: minecraft-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/andreabedini/minecraft-operator/operator:latest
          args:
            - --leader-elect
          env:
            # SUPERVISOR_IMAGE (the image copied into every server pod)
            # defaults to the supervisor built with the operator:
            # ghcr.io/andreabedini/minecraft-operator/supervisor:<version>.
            - name: JAVA_IMAGE_TEMPLATE
              value: eclipse-temurin:%d-jre
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
