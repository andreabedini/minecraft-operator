apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-upstream
  namespace: minecraft-operator
  labels:
    app.kubernetes.io/name: fake-upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-upstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-upstream
    spec:
      containers:
        - name: publisher
          image: docker.io/minecraft-operator/fakeserver:e2e
          imagePullPolicy: IfNotPresent
          args:
            - publish
            - -listen
            - ":8080"
            - -public-url
            - http://fake-upstream.minecraft-operator.svc:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-upstream
  namespace: minecraft-operator
spec:
  selector:
    app.kubernetes.io/name: fake-upstream
  ports:
    - name: http
      port: 8080
      targetPort: http
