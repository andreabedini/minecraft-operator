# Test, then build the operator and supervisor images with ko.
#
#   pull request    build only, nothing pushed
#   push to main    push :main and :sha-<short>
#   tag vX.Y.Z      push :vX.Y.Z, :vX.Y and :latest, and publish a GitHub
#                   release with install.yaml pinned to the image digests
#   tag vX.Y.Z-rc1  push :vX.Y.Z-rc1 only, and publish a pre-release
#   manual run      like a push when run on main or a tag, else build only
#
# The binaries carry VERSION, and the operator defaults its supervisor image
# to supervisor:<VERSION>, so both images always get the VERSION tag.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      packages: write # ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Sets KO_DOCKER_REPO=ghcr.io/<owner>/<repo> and logs in to ghcr.io
      # with GITHUB_TOKEN; it skips both when KO_DOCKER_REPO is preset.
      - uses: ko-build/setup-ko@v0.10

      - name: Version and tags
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=$GITHUB_REF_NAME; tags=$version; push=true
              # Plain releases also move :vX.Y and :latest; pre-releases don't.
              if [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                tags=$tags,${version%.*},latest
              fi
              ;;
            refs/heads/main) version=sha-${GITHUB_SHA::7}; tags=$version,main; push=true ;;
            refs/pull/*) version=pr-${{ github.event.pull_request.number }}; tags=$version; push=false ;;
            *) version=sha-${GITHUB_SHA::7}; tags=$version; push=false ;;
          esac
          {
            echo "VERSION=$version"
            echo "TAGS=$tags"
            echo "PUSH=$push"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          for b in operator supervisor; do
            # stdout is the index reference, name:tag@digest
            ko build --base-import-paths --tags "$TAGS" --push="$PUSH" \
              --image-label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --image-label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --image-label "org.opencontainers.image.version=$VERSION" \
              "./cmd/$b" > "ref-$b"
          done
          cat ref-*

      - name: Render install.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/release
          cat > dist/release/kustomization.yaml <<YAML
          resources:
            - ../../config/default
          patches:
            - target: {kind: Deployment, name: minecraft-operator}
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/image
                  value: $(cat ref-operator)
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value: {name: SUPERVISOR_IMAGE, value: "$(cat ref-supervisor)"}
          YAML
          kubectl kustomize dist/release > install.yaml

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes --verify-tag)
          if [[ $GITHUB_REF_NAME == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" install.yaml "${args[@]}"
