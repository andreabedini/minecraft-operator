# Test, then build the operator and supervisor images with ko.
#
#   pull request  build only, nothing pushed
#   push to main  push :main and :sha-<short>
#   tag v*        push :<tag> and :latest, and publish a GitHub release with
#                 install.yaml pinned to the image digests
#
# The binaries carry VERSION, and the operator defaults its supervisor image
# to supervisor:<VERSION>, so both images always get the VERSION tag.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      packages: write # ghcr.io
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.9 # logs in to ghcr.io with GITHUB_TOKEN

      - name: Version and tags
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version=$GITHUB_REF_NAME; tags=$version,latest; push=true ;;
            refs/heads/main) version=sha-${GITHUB_SHA::7}; tags=$version,main; push=true ;;
            *) version=pr-${{ github.event.pull_request.number }}; tags=$version; push=false ;;
          esac
          {
            echo "VERSION=$version"
            echo "TAGS=$tags"
            echo "PUSH=$push"
            echo "KO_DOCKER_REPO=${KO_DOCKER_REPO,,}"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          for b in operator supervisor; do
            # stdout is the index reference, name:tag@digest
            ko build --base-import-paths --tags "$TAGS" --push="$PUSH" \
              --image-label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --image-label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --image-label "org.opencontainers.image.version=$VERSION" \
              "./cmd/$b" > "ref-$b"
          done
          cat ref-*

      - name: Render install.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/release
          cat > dist/release/kustomization.yaml <<YAML
          resources:
            - ../../config/default
          patches:
            - target: {kind: Deployment, name: minecraft-operator}
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/image
                  value: $(cat ref-operator)
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value: {name: SUPERVISOR_IMAGE, value: "$(cat ref-supervisor)"}
          YAML
          kubectl kustomize dist/release > install.yaml

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" install.yaml --generate-notes --verify-tag
